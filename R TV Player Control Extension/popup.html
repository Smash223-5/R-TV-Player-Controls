<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    :root {
      --bg: #121212;
      --cont: #1e1e1e;
      --txt: #f5f5f7;
      --label-txt: #ffffff;
      --input-bg: #2c2c2e;
      --pass-green: #32C900;
      --fail-red: #FF0000;
      --gen-gray: #8e8e93;
    }

    html {
      background: transparent;
    }

    body {
      width: 280px;
      margin: 0;
      padding: 0;
      font-family: 'Monaco', 'Consolas', monospace;
      background: var(--bg);
      color: var(--txt);
      box-sizing: border-box;
      user-select: none;
      overflow: hidden;
      border-radius: 16px;
    }

    .container {
      background: var(--cont);
      padding: 16px;
      border-radius: 0px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      position: relative;
    }

    /* Header Styling */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
    }

    h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      color: var(--txt);
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--gen-gray);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }

    .icon-btn:hover {
      color: var(--txt);
      background: var(--input-bg);
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Views Switching */
    .view {
      display: block;
    }

    .hidden {
      display: none !important;
    }

    /* Main Menu Components */
    .menu-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      background: var(--input-bg);
      padding: 10px 12px;
      border-radius: 10px;
    }

    .menu-row span {
      font-size: 13px;
      font-weight: bold;
    }

    .toggle-btn {
      width: 48px;
      height: 28px;
      border-radius: 8px;
      border: none;
      color: #ffffff;
      font-weight: 900;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }

    .toggle-btn:active {
      transform: scale(0.95);
    }

    .toggle-btn.on {
      background: var(--pass-green);
    }

    .toggle-btn.off {
      background: var(--fail-red);
    }

    .main-action-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(135deg, #777BFB 0%, #DD6CFB 100%);
      color: #ffffff;
      font-weight: bold;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }

    .main-action-btn:hover {
      opacity: 0.9;
    }

    .main-action-btn:active {
      transform: scale(0.98);
    }

    /* Settings View Components */
    .section-title {
      font-size: 11px;
      font-weight: bold;
      color: var(--gen-gray);
      text-transform: uppercase;
      margin-bottom: 10px;
      display: block;
    }

    .input-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 6px;
      color: var(--label-txt);
    }

    select, input[type="text"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: var(--input-bg);
      color: var(--txt);
      box-sizing: border-box;
      outline: none;
      font-size: 12px;
      font-family: inherit;
      transition: border-color 0.2s, opacity 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: #777BFB;
    }

    .settings-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 16px;
    }

    .save-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: none;
      background: var(--pass-green);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: opacity 0.2s, transform 0.1s;
    }

    .save-btn:hover {
      opacity: 0.9;
    }

    .save-btn:active {
      transform: scale(0.95);
    }

    .save-btn svg {
      width: 18px;
      height: 18px;
      fill: #000000;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- MAIN MENU -->
    <div id="mainView" class="view">
      <div class="header">
        <div class="header-left">
          <img src="icon.png" class="logo-img" alt="Logo">
          <h2>R TV Controls</h2>
        </div>
        <button id="openSettingsBtn" class="icon-btn" title="Settings">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>
      </div>

      <div class="menu-row">
        <span>Extension</span>
        <button id="toggleBtn" class="toggle-btn on">ON</button>
      </div>

      <button id="rtvBtn" class="main-action-btn">R TV</button>
    </div>

    <!-- SETTINGS MENU -->
    <div id="settingsView" class="view hidden">
      <div class="header">
        <div class="header-left">
          <button id="backBtn" class="icon-btn" title="Back">
            <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
          </button>
          <h2>Settings</h2>
        </div>
      </div>

      <span class="section-title">R TV Link</span>

      <div class="input-group">
        <label for="linkMode">Link Option</label>
        <select id="linkMode">
          <option value="original">Original Link</option>
          <option value="custom">Custom Link</option>
        </select>
      </div>

      <div class="input-group">
        <label for="customUrl">Custom Link URL</label>
        <input type="text" id="customUrl" placeholder="https://t.me/your_bot/app">
      </div>

      <div class="settings-footer">
        <button id="saveBtn" class="save-btn" title="Save Settings">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
            <path d="m486.996 64.383-39.379-39.38A85.23 85.23 0 0 0 387.285 0H58.668C26.262 0 0 26.262 0 58.668v394.664C0 485.738 26.262 512 58.668 512h394.664C485.738 512 512 485.738 512 453.332V124.715a85.23 85.23 0 0 0-25.004-60.332M85.332 133.332V80c0-8.832 7.168-16 16-16h224c8.832 0 16 7.168 16 16v53.332c0 8.832-7.168 16-16 16h-224c-8.832 0-16-7.168-16-16M256 426.668c-53.012 0-96-42.988-96-96 0-53.016 42.988-96 96-96s96 42.984 96 96c0 53.012-42.988 96-96 96"/>
          </svg>
        </button>
      </div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
